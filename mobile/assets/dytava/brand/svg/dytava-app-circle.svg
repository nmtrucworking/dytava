    <linearGradient id="purpleLayer" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C084FC"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="brandBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Circular container -->
  <circle cx="256" cy="256" r="248" fill="url(#circleBg)"/>
  
  <g transform="translate(8, 6) scale(0.97)">
