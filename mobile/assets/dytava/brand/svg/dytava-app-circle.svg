      <rect x="215" y="286" width="31" height="80" rx="7" fill="white"/>
      <rect x="262" y="245" width="31" height="121" rx="7" fill="white"/>
      <rect x="309" y="209" width="31" height="157" rx="7" fill="white"/>
    </g>
