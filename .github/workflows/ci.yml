name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-web:
    name: Web & Node.js Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm test

  test-dart-core:
    name: Pure Dart Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.x'
      - name: Install Core dependencies
        working-directory: packages/excelcompare_core
        run: dart pub get
      - name: Analyze Core
        working-directory: packages/excelcompare_core
        run: dart analyze
      - name: Test Core
        working-directory: packages/excelcompare_core
        run: dart test

  test-mobile:
    name: Flutter Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true
      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze
      - name: Run Flutter Tests
        working-directory: mobile
        run: flutter test
