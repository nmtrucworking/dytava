# Add inside existing flutter: section of mobile/pubspec.yaml (do NOT add a second flutter: key).
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/PlusJakartaSans-OFL.txt
    - assets/fonts/BeVietnamPro-OFL.txt
    - assets/fonts/IBMPlexMono-OFL.txt
    - assets/dytava/brand/png_4k/
    - assets/dytava/brand/svg/
    - assets/dytava/icons/svg/color/
    - assets/dytava/icons/svg/glyph/
    - assets/dytava/icons/svg/outline/
    - assets/dytava/icons/png_512/
    - assets/dytava/icons/png_128/
    - assets/dytava/formats/svg/
    # PNG 4K files are archival / exports: DON'T bundle them by default.
    # - assets/dytava/icons/png_4k/
    # - assets/dytava/formats/png_4k/

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
